name: Create CV

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CV generator script
        run: python create_cv.py

      # Télécharge le contenu de build/ comme artefact privé (non commité sur le dépôt)
      - name: Upload generated PDF as private artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: build/rendercv_output/*.pdf
          retention-days: 1